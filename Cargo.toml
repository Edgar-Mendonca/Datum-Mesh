[workspace]
resolver = "2"
members = ["crates/core", "crates/cad", "src-tauri"]
# app/: SolidCraft's crates (their own workspace), used only as the geometry engine behind
# crates/cad (0.7.1).
exclude = ["app"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
opt-level = 3
# Thin LTO in parallel pieces (0.7.1): the geometry engine (app/) is too large for whole-program
# optimisation in one piece; our solver keeps one piece below.
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true

# Solvers are slow without optimisation; keep tests and dev runs usable.
[profile.release.package.datum-core]
codegen-units = 1

[profile.dev.package.datum-core]
opt-level = 2
