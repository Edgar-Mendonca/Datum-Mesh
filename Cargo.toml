[workspace]
resolver = "2"
members = ["crates/core", "crates/cad", "src-tauri"]
# app/: SolidCraft's crates (their own workspace), used only as the geometry engine behind
# crates/cad (0.7.1).
exclude = ["app"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Solvers are slow without optimisation; keep tests and dev runs usable.
[profile.dev.package.datum-core]
opt-level = 2
