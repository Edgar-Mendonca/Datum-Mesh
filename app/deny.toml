# Datum Mesh: the licence policy of the repository root (CLAUDE.md, NOTICE): permissive licences only.
[advisories]
# Unmaintained crates deep in the window toolkit are reported upstream; a direct dependency of ours fails.
# Vulnerabilities always fail.
unmaintained = "workspace"
yanked = "warn"
# ttf-parser reads fonts for text in sketches; unmaintained, no known vulnerability, no maintained
# drop-in yet. Revisit when upstream moves.
ignore = [{ id = "RUSTSEC-2026-0192", reason = "unmaintained only; used to read fonts for sketch text" }]

[bans]
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# solidcore, pinned by rev in Cargo.toml (the kernel behind crates/smlib).
allow-git = ["https://github.com/tangency-labs/solidcore"]

[licenses]
confidence-threshold = 0.9
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "MPL-2.0", "CC0-1.0", "CDLA-Permissive-2.0", "BSL-1.0", "OFL-1.1", "Ubuntu-font-1.0"]
# BSL-1.0: clipboard-win and error-code (permissive). OFL-1.1 and Ubuntu-font-1.0: the window's default
# fonts (epaint_default_fonts), bundled unchanged with their licences, as the IBM Plex fonts were.
