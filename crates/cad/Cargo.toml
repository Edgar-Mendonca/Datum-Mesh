[package]
name = "datum-cad"
version = "0.7.7"
edition = "2021"
license = "MIT"
description = "Datum Mesh's geometry engine bridge: a headless SolidCraft session behind the Datum window"
publish = false

[dependencies]
solidcraft-engine = { path = "../../app/crates/engine" }
solidcraft-doc = { path = "../../app/crates/doc" }
solidcraft-sketch = { path = "../../app/crates/sketch" }
datum-analysis = { path = "../../app/crates/analysis" }
datum-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
