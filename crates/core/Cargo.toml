[package]
name = "datum-core"
version = "0.1.2"
license = "MIT"
edition = "2021"
description = "Datum Mesh engine: the model and its edits, sections, meshing, finite elements, solver, results and benchmarks."

[dependencies]
serde.workspace = true
serde_json.workspace = true
# Sparse Cholesky (MIT), https://github.com/sarah-quinones/faer-rs
faer = { version = "0.24", default-features = false, features = ["std", "sparse-linalg"] }
