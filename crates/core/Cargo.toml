[package]
name = "datum-core"
version = "0.3.1"
license = "MIT"
edition = "2021"
description = "Datum Mesh engine: the model and its edits, sections, meshing, finite elements, solver, results and benchmarks."

[dependencies]
serde.workspace = true
serde_json.workspace = true
# Sparse Cholesky (MIT), https://github.com/sarah-quinones/faer-rs
faer = { version = "0.24", default-features = false, features = ["std", "sparse-linalg", "rayon"] }
# Constrained Delaunay triangulation with refinement (MIT OR Apache-2.0), https://github.com/Stoeoef/spade
spade = "2.15"
i_overlay = "=9.0.1"
