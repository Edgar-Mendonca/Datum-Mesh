name: CI
# The family build budget (FAMILY §9): every Datum repo shares one account's job capacity, so CI
# is a safety net, not the place checks are first run. The full checks run locally before a push
# (CLAUDE.md). On a push or pull request: one fast Linux job and the two licence checks. Nightly
# (only when something changed) and by hand: the release build of app/, Windows, and the UI tests.
on:
  push:
    # This repository's default branch is the session branch (it has no main); both are listed.
    branches: [main, claude/upbeat-maxwell-xxve2b]
    paths-ignore: ["**.md", "docs/**", "LICENSE", "NOTICE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE", "NOTICE"]
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

# A newer push cancels the run still going for the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The fast job: the window's types, build and size budget; clippy and every engine test (debug).
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Give up quickly when Ubuntu's mirrors do not answer, instead of hanging.
      - name: System libraries for Tauri
        timeout-minutes: 10
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $APT update && sudo apt-get $APT install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev gmsh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:ui
      - run: npm run build:ui
      - name: Size budget of the window
        run: node tools/size.cjs
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Licences, security advisories and crate sources (deny.toml).
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # The application's licences and sources (app/deny.toml).
  app-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: app/Cargo.toml

  # Nightly and by hand only. A nightly run with no commit in the last 24 hours stops here.
  changed:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.c.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        run: |
          last=$(git log -1 --format=%ct); now=$(date +%s)
          if [ "${{ github.event_name }}" != "schedule" ] || [ $((now - last)) -lt 86400 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new commits since the last nightly run: nothing to do."; echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # The application built on SolidCraft (app/) with the analysis: it builds in release, the
  # analysis crate's tests pass, and its own clippy is clean.
  app:
    needs: changed
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app -> target
      - name: Analysis tests
        working-directory: app
        run: cargo test --release -p datum-analysis
      - name: Clippy on the analysis and the window
        working-directory: app
        run: cargo clippy --release -p datum-analysis -p solidcraft-ui-egui --no-deps -- -D warnings
      - name: The program builds
        working-directory: app
        run: cargo build --release -p solidcraft --bin datum-mesh

  # The engine and the shell build and pass their tests on Windows, the system Datum ships for.
  # (No macOS job for now: a CI cost decision, not a product one; the code stays cross-platform.)
  windows:
    needs: changed
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.changed.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:ui
      - run: cargo test --workspace

  # The window in Chromium with the engine's real results (the fixture is made fresh here).
  ui:
    needs: changed
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:ui
      - name: UI tests (Playwright)
        run: |
          npm i -g playwright@1.63.0
          npx -y playwright@1.63.0 install --with-deps chromium
          cargo run -q -p datum-core --example dump > tests_ui/fixture.json
          NODE_PATH=$(npm root -g) node tests_ui/run.cjs
