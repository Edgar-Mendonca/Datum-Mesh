name: CI
on:
  push:
    branches: ["**"]
    # Words only (docs, changelog, notes) do not need the engine rebuilt.
    paths-ignore: ["docs/**", "**.md", "NOTICE"]
  pull_request:
    paths-ignore: ["docs/**", "**.md", "NOTICE"]
  # macOS once a week and by hand (Actions › CI › Run workflow); Windows and Linux on every push.
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

# A newer push to the same branch cancels the run still going for the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      # Give up quickly when Ubuntu's mirrors do not answer, instead of hanging for hours.
      - name: System libraries for Tauri
        timeout-minutes: 10
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $APT update && sudo apt-get $APT install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev gmsh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:ui
      - run: npm run build:ui
      - name: Size budget of the window
        run: node tools/size.cjs
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: UI tests (Playwright)
        timeout-minutes: 20
        run: |
          npm i -g playwright@1.63.0
          npx -y playwright@1.63.0 install --with-deps chromium
          cargo run -q -p datum-core --example dump > tests_ui/fixture.json
          NODE_PATH=$(npm root -g) node tests_ui/run.cjs

  # Licences, security advisories and crate sources (deny.toml).
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # The engine and the app build and pass their tests on Windows and macOS too.
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["windows-latest","macos-latest"]' || '["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:ui
      - run: cargo test --workspace

  # The application (built on SolidCraft, in app/) with the analysis: it builds, the analysis
  # crate's tests pass, and its own clippy is clean.
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app -> target
      - name: Analysis tests
        working-directory: app
        run: cargo test --release -p datum-analysis
      - name: Clippy on the analysis and the window
        working-directory: app
        run: cargo clippy --release -p datum-analysis -p solidcraft-ui-egui --no-deps -- -D warnings
      - name: The program builds
        working-directory: app
        run: cargo build --release -p solidcraft --bin datum-mesh

  # The application's licences and sources (app/deny.toml).
  app-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: app/Cargo.toml
