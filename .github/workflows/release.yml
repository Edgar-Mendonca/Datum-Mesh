name: Release
# Builds one Windows installer, DatumMesh-x.y.z-setup.exe, and publishes it with SHA256SUMS.txt
# as a GitHub Release (the shape Datum Home and the in-app updater rely on, FAMILY §9).
# Bump the version in src-tauri/Cargo.toml and crates/core/Cargo.toml, add a CHANGELOG.md section,
# then run this workflow from the Actions tab (or push a tag: git tag v0.1.0 && git push origin v0.1.0).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write   # build provenance: proves the installer was built here, from this commit
  attestations: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read the app version
        shell: bash
        run: |
          V=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          if [[ "$GITHUB_REF" == refs/tags/* && "v$V" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match version $V in src-tauri/Cargo.toml"; exit 1
          fi
          echo "V=$V" >> "$GITHUB_ENV"
      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          awk -v v="$V" 'index($0, "## " v " ") == 1 || $0 == "## " v {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          cat notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $V"; exit 1; }
      - run: cargo test -p datum-core
      - name: The mesher (Gmsh, a separate program, GPL; installed beside Datum Mesh)
        shell: bash
        run: |
          mkdir -p src-tauri/gmsh
          ok=""
          for v in 4.15.2 4.14.1 4.13.1; do
            if curl -fsSL -o gmsh.zip "https://gmsh.info/bin/Windows/gmsh-$v-Windows64.zip"; then ok=$v; break; fi
          done
          test -n "$ok" || { echo "Gmsh could not be downloaded"; exit 1; }
          echo "Gmsh $ok"
          7z x -y gmsh.zip -ogmsh_unz > /dev/null
          exe=$(find gmsh_unz -iname gmsh.exe | head -1)
          test -n "$exe" || { echo "gmsh.exe not found in the download"; exit 1; }
          cp "$exe" src-tauri/gmsh/gmsh.exe
          d=$(dirname "$exe")
          for f in LICENSE.txt CREDITS.txt; do [ -f "$d/$f" ] && cp "$d/$f" "src-tauri/gmsh/$f"; done
          echo "Gmsh $ok from gmsh.info, run by Datum Mesh as a separate program (GPL). Source: https://gitlab.onelab.info/gmsh/gmsh" > src-tauri/gmsh/README.txt
      - name: The command line (datum-mesh-cli, installed beside the program in cli/)
        shell: bash
        run: |
          cargo build --release -p datum-mesh-cli
          mkdir -p src-tauri/cli
          cp target/release/datum-mesh-cli.exe src-tauri/cli/datum-mesh-cli.exe
      # The installer maker (NSIS) and its plugin, which Tauri downloads from GitHub's releases, kept
      # between runs (0.10.2: the download failed with 504 twice during a GitHub outage).
      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/tauri
          key: tauri-bundler-tools-nsis-3.13
      - name: Installer
        shell: bash
        run: |
          # Retried with growing waits when the tools' download fails (the program itself is built
          # once; a retry only bundles again).
          ok=""
          for i in 1 2 3 4 5 6; do
            if npx tauri build --bundles nsis --config '{"bundle":{"resources":{"gmsh/":"gmsh/","cli/":"cli/"}}}'; then ok=1; break; fi
            echo "Bundling failed (try $i of 6); waiting $((i * 90)) s"; sleep $((i * 90))
          done
          test -n "$ok" || { echo "The installer could not be made"; exit 1; }
          mkdir -p out
          cp target/release/bundle/nsis/*-setup.exe "out/DatumMesh-$V-setup.exe"
          cd out && sha256sum "DatumMesh-$V-setup.exe" > SHA256SUMS.txt && cat SHA256SUMS.txt && ls -la
      - name: Size budget of the installer (150 MB, docs/MEMORY.md)
        shell: bash
        run: |
          N=$(wc -c < "out/DatumMesh-$V-setup.exe")
          echo "Installer: $N bytes (budget 150000000)"
          test "$N" -le 150000000 || { echo "The installer is over its 150 MB budget."; exit 1; }
      # Build provenance. Anyone can check it with: gh attestation verify DatumMesh-<version>-setup.exe --repo Edgar-Mendonca/Datum-Mesh
      - name: Build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: out/DatumMesh-${{ env.V }}-setup.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.V }}
          target_commitish: ${{ github.sha }}
          name: Datum Mesh ${{ env.V }}
          body_path: notes.md
          make_latest: true
          files: |
            out/DatumMesh-${{ env.V }}-setup.exe
            out/SHA256SUMS.txt
