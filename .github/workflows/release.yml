name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 240
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            app -> target
      - name: Read the app version
        shell: bash
        run: |
          V=$(grep -m1 '^version' app/Cargo.toml | cut -d'"' -f2)
          if [[ "$GITHUB_REF" == refs/tags/* && "v$V" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match version $V in app/Cargo.toml"; exit 1
          fi
          echo "V=$V" >> "$GITHUB_ENV"
      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          awk -v v="$V" 'index($0, "## " v " ") == 1 || $0 == "## " v {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          cat notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $V"; exit 1; }
      - name: Engine tests (benchmarks included)
        run: cargo test --release -p datum-core
      - name: Analysis tests
        working-directory: app
        run: cargo test --release -p datum-analysis
      - name: The program
        working-directory: app
        shell: bash
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --release -p solidcraft --bin datum-mesh
      - name: The mesher (Gmsh, a separate program)
        shell: bash
        run: |
          mkdir -p out/stage/gmsh
          ok=""
          for v in 4.15.2 4.14.1 4.13.1; do
            if curl -fsSL -o gmsh.zip "https://gmsh.info/bin/Windows/gmsh-$v-Windows64.zip"; then ok=$v; break; fi
          done
          test -n "$ok" || { echo "Gmsh could not be downloaded"; exit 1; }
          echo "Gmsh $ok"
          7z x -y gmsh.zip -ogmsh_unz > /dev/null
          exe=$(find gmsh_unz -iname gmsh.exe | head -1)
          test -n "$exe" || { echo "gmsh.exe not found in the download"; exit 1; }
          cp "$exe" out/stage/gmsh/gmsh.exe
          d=$(dirname "$exe")
          for f in LICENSE.txt CREDITS.txt; do [ -f "$d/$f" ] && cp "$d/$f" "out/stage/gmsh/$f"; done
          echo "Gmsh $ok from gmsh.info, run as a separate program (GPL). Source: https://gitlab.onelab.info/gmsh/gmsh" > out/stage/gmsh/README.txt
      - name: Installer
        shell: bash
        run: |
          cp app/target/release/datum-mesh.exe out/stage/datum-mesh.exe
          cat LICENSE app/LICENSE-MIT > out/stage/LICENSE.txt
          cat NOTICE app/NOTICE app/THIRD-PARTY-LICENSES.txt > out/stage/NOTICE.txt
          makensis -DVERSION="$V" -DSRC="$(cygpath -w "$PWD/out/stage")" app/packaging/windows/datum-mesh.nsi
          mkdir -p out/release
          mv "app/packaging/windows/DatumMesh-$V-setup.exe" "out/release/DatumMesh-$V-setup.exe"
          cd out/release && sha256sum "DatumMesh-$V-setup.exe" > SHA256SUMS.txt && cat SHA256SUMS.txt && ls -la
      - name: Size budget of the installer (150 MB, docs/MEMORY.md)
        shell: bash
        run: |
          N=$(wc -c < "out/release/DatumMesh-$V-setup.exe")
          echo "Installer: $N bytes (budget 150000000)"
          test "$N" -le 150000000 || { echo "The installer is over its 150 MB budget."; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.V }}
          target_commitish: ${{ github.sha }}
          name: Datum Mesh ${{ env.V }}
          body_path: notes.md
          make_latest: true
          files: |
            out/release/DatumMesh-${{ env.V }}-setup.exe
            out/release/SHA256SUMS.txt
